name: build
# Push as well as pull_request -- this repo commits straight to feature
# branches, so a pull_request-only trigger would never fire.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        # Unpiped on purpose: a pipe would report the exit code of the pipe's
        # last stage and a red suite would ship as green.
        run: go test ./...
