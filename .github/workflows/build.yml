name: build
# Push as well as pull_request -- this repo commits straight to feature
# branches, so a pull_request-only trigger would never fire.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # No test step: this repo has no _test.go files yet. When it gets them,
      # add `go test ./...` here rather than leaving the suite to run only on
      # whichever machine remembers.
